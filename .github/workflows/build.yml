name: Build and Release NEXUS

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run Automated Tests
        run: |
          python -m pytest -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NEXUS-ResourceMonitor" --add-data "src;src" main.py

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path dist/NEXUS-ResourceMonitor -DestinationPath dist/NEXUS-ResourceMonitor-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-x64
          path: dist/NEXUS-ResourceMonitor-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NEXUS-ResourceMonitor-Windows-x64.zip
          generate_release_notes: true
